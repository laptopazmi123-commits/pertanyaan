<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apakah Kamu Punya Pacar?</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #111;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
    overflow: hidden;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 40px;
    text-align: center;
    animation: shake 0.5s infinite alternate;
  }

  @keyframes shake {
    from { transform: translateX(-3px); }
    to   { transform: translateX(3px); }
  }

  .buttons {
    display: flex;
    gap: 30px;
  }

  button {
    padding: 18px 50px;
    font-size: 1.4rem;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: #fff;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  #btnYes { background: #22c55e; }
  #btnNo  { background: #ef4444; }

  button:hover {
    transform: scale(1.08);
    box-shadow: 0 0 30px rgba(255,255,255,0.6);
  }

  #jumpscare {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }

  #jumpscare.active {
    display: flex;
    animation: flash 0.15s infinite;
  }

  #jumpscare video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  @keyframes flash {
    0%   { background: #000; }
    50%  { background: #300; }
    100% { background: #000; }
  }
</style>
</head>
<body>

  <h1>Apakah kamu punya pacar?</h1>

  <div class="buttons">
    <button id="btnYes">YES</button>
    <button id="btnNo">NO</button>
  </div>

  <div id="jumpscare">
    <video id="scareVideo" playsinline preload="auto" loop></video>
  </div>

<script>
  const jumpscare = document.getElementById('jumpscare');
  const video = document.getElementById('scareVideo');

  // ============================================================
  //  GANTI NAMA FILE DI BAWAH INI DENGAN NAMA VIDEO MILIKMU
  //  File video harus SATU FOLDER dengan index.html ini
  // ============================================================
  const VIDEO_URL = "https://videotourl.com/videos/1792750275236-2f8c8f9f-1e94-4f92-9049-9668c3f4f1b2.mp4";  // <-- GANTI DI SINI

  video.volume = 1.0;
  video.muted = false;
  video.loop = true;
  video.src = VIDEO_URL;
  video.load();

  let sudahDiputar = false;

  function mulaiJumpscare() {
    if (sudahDiputar) return;
    sudahDiputar = true;

    video.volume = 1.0;
    video.muted = false;
    video.loop = true;
    video.currentTime = 0;

    jumpscare.classList.add('active');

    const playPromise = video.play();
    if (playPromise !== undefined) {
      playPromise.catch(err => {
        console.warn("Gagal autoplay:", err);
        setTimeout(() => {
          video.volume = 1.0;
          video.muted = false;
          video.play().catch(e => console.warn("Retry gagal:", e));
        }, 100);
      });
    }
  }

  document.getElementById('btnYes').addEventListener('click', mulaiJumpscare);
  document.getElementById('btnNo').addEventListener('click', mulaiJumpscare);
</script>

</body>
</html>
